<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Complaint | JHB Civic Report</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f7fb;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            outline: none;
        }

        .btn {
            background: #0B3C5D;
            color: white;
            padding: 14px 20px;
            border-radius: 12px;
            cursor: pointer;
        }

        .btn:hover {
            background: #145C8C;
        }
    </style>

</head>

<body>

    <!-- NAV -->
    <nav class="bg-white shadow-md p-4">
        <div class="max-w-6xl mx-auto flex justify-between">
            <h1 class="font-bold text-blue-900 text-xl">JHB Civic Report</h1>

            <div class="space-x-6">
                <a href="index.html">Home</a>
                <a href="report.html">Report</a>
                <a href="track.html" class="font-bold text-blue-900">Track</a>
            </div>
        </div>
    </nav>

    <!-- MAIN -->
    <div class="max-w-3xl mx-auto mt-16 px-4">

        <div class="card">

            <h2 class="text-2xl font-bold mb-6">
                Track Your Complaint
            </h2>

            <input 
                id="searchId"
                class="input mb-4"
                placeholder="Enter Complaint ID (e.g. JHB-2026-1234)"
            >

            <button onclick="trackComplaint()" class="btn w-full">
                Track Complaint
            </button>

            <div id="result" class="mt-8"></div>

        </div>

    </div>


    <script src="js/track.js"></script>

</body>
</html>
