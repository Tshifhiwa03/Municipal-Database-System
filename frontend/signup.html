<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Citizen Signup</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>

        body{
            font-family:'Poppins',sans-serif;
            background:#f4f7fb;
        }

        .card{
            background:white;
            padding:40px;
            border-radius:24px;
            box-shadow:0 10px 25px rgba(0,0,0,0.05);
        }

        .input{
            width:100%;
            padding:14px;
            border-radius:12px;
            border:1px solid #d1d5db;
            margin-top:8px;
        }

        .btn{
            width:100%;
            background:#0B3C5D;
            color:white;
            padding:14px;
            border-radius:12px;
            margin-top:20px;
        }

    </style>

</head>

<body class="flex items-center justify-center min-h-screen">

    <div class="card w-full max-w-md">

        <h1 class="text-3xl font-bold mb-6 text-center">
            Account Sign Up
        </h1>

        <p class="text-gray-600 mb-4">
            Create an account to submit and track municipal complaints.
        </p>

        <form id="signupForm">

            <div class="mb-4">
                <label>Full Name</label>
                <input
                    type="text"
                    id="signupName"
                    class="input"
                >
            </div>

            <div class="mb-4">
                <label>Phone Number</label>
                <input
                    type="tel"
                    id="signupPhone"
                    class="input"
                >
            </div>

            <div class="mb-4">

                <label>Email</label>

                <input
                    type="email"
                    id="signupEmail"
                    class="input"
                >

            </div>

            <div class="mb-4">

                <label>Password</label>

                <div class="relative">
                    <input
                        type="password"
                        id="signupPassword"
                        class="input pr-12"
                    >

                    <button
                        type="button"
                        id="toggleSignupPassword"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-800"
                        aria-label="Show password"
                    >
                        <!-- Eye icon -->
                        <svg
                            id="signupPasswordEye"
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="w-5 h-5"
                        >
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

            </div>

            <button type="submit" class="btn">
                Create Account
            </button>

        </form>

        <p class="text-center mt-6">

            Already have an account?

            <a
                href="login.html"
                class="text-blue-900 font-semibold"
            >
                Login
            </a>

        </p>

    </div>

    <script src="js/auth.js"></script>
    <script>
        (function () {
            const passwordInput = document.getElementById("signupPassword");
            const toggleBtn = document.getElementById("toggleSignupPassword");

            if (!passwordInput || !toggleBtn) return;

            toggleBtn.addEventListener("click", function () {
                const isPassword = passwordInput.type === "password";
                passwordInput.type = isPassword ? "text" : "password";
                toggleBtn.setAttribute(
                    "aria-label",
                    isPassword ? "Hide password" : "Show password"
                );
            });
        })();
    </script>

</body>
</html>
